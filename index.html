<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.44.0/tabler-icons.min.css"
        integrity="sha512-51mlV3yV4w8hWM53dgWBoArshl8CTDwsDH0Oqzpp4JmwuIxJ3TUlMknQSgu/V2sBGZepqacbBhkVleh+9EeyhA=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="./CSS/style.css">
    <title>HfinityOS</title>
</head>

<body>
    <header class="menu-bar">
        <div class="left-menu">
            <a href="#">
                <i class="fa-brands fa-apple"></i>
            </a>
            <a href="#">Finder</a>
            <a href="#">File</a>
            <a href="#">Edit</a>
            <a href="#">View</a>
            <a href="#">Go</a>
            <a href="#">Window</a>
            <a href="#">Help</a>
        </div>
        <div class="right-menu">
            <img src="./Assets/Icons/Menu/location.svg" alt="" class="menu-icon">
            <img src="./Assets/Icons/Menu/bluetooth.svg" alt="" class="menu-icon">
            <img src="./Assets/Icons/Menu/wifi.svg" alt="">
            <img src="./Assets/Icons/Menu/user-circle.svg" alt="" class="menu-icon">
            <img src="./Assets/Icons/Menu/search.svg" alt="" class="menu-icon">
            <div class="battery-icon">
                <span>22%</span>
                <img src="./Assets/Icons/Menu/battery-1.svg" alt="" class="battery-icon">
            </div>
            <img src="./Assets/Icons/Menu/control-center-icon.png" alt="Icon Of Control Centre" class="control-center">
            <img src="./Assets/Icons/Menu/siri.png" alt="Siri Icon" class="siri-icon">
            <a href="#">Thu 9 Jul 6:41 AM</a>
        </div>
    </header>
    <main class="desktop">
        <div class="window">
            <div class="window-sidebar">
                <div class="window-controls">
                    <button class="close">
                        <i class="fa-solid fa-circle-xmark" style="color: #FF5F58;"></i>
                    </button>
                    <button class="minimize">
                        <i class="fa-solid fa-circle-minus" style="color: #FEBC2E;"></i>
                    </button>
                    <button class="maximize">
                        <i class="fa-solid fa-circle-plus" style="color: #27C840;"></i>
                    </button>
                </div>

                <div class="sidebar-links">
                    <div class="sidebar-group">
                        <h3 class="sidebar-head">Favorites</h3>
                        <div class="icon-list">
                            <button class="sidebar-icons">
                                <i class="ti ti-clock-hour-9"></i>
                                <span>Recents</span>
                            </button>
                            <button class="sidebar-icons">
                                <i class="ti ti-brand-appstore"></i>
                                <span>Applications</span>
                            </button>
                            <button class="sidebar-icons">
                                <i class="ti ti-app-window"></i>
                                <span>Desktop</span>
                            </button>
                            <button class="sidebar-icons">
                                <i class="ti ti-circle-arrow-down"></i>
                                <span>Downloads</span>
                            </button>
                        </div>
                    </div>

                    <div class="sidebar-group">
                        <h3 class="sidebar-head">iCloud</h3>
                        <div class="icon-list">
                            <button class="sidebar-icons">
                                <i class="ti ti-cloud" style="color:#30CEEA;"></i>
                                <span>iCloud Drive</span>
                            </button>
                            <button class="sidebar-icons">
                                <i class="ti ti-file" style="color:#30CEEA;"></i>
                                <span>Documents</span>
                            </button>
                            <button class="sidebar-icons">
                                <i class="ti ti-app-window" style="color:#30CEEA;"></i>
                                <span>Desktop</span>
                            </button>
                            <button class="sidebar-icons">
                                <i class="ti ti-folder-share" style="color:#30CEEA;"></i>
                                <span>Shared</span>
                            </button>
                        </div>
                    </div>
                </div>

            </div>

            <div class="window-main">
                <div class="window-header">
                    <div class="window-nvg">
                        <div>
                            <i class="ti ti-chevron-left"></i>
                            <i class="ti ti-chevron-right"></i>
                        </div>
                        <h3>Recents</h3>
                    </div>

                    <div class="window-quick-actions">
                        <div class="quick-view">
                            <i class="ti ti-layout-grid font1"></i>
                            <i class="ti ti-selector"></i>
                        </div>

                        <div class="quick-act">
                            <div class="window-sort">
                                <img src="./Assets/Icons/Window Icons/grid-divider.svg" height="20px" width="20px">
                                <i class="ti ti-chevron-down"></i>
                            </div>

                            <i class="ti ti-share-2 font1"></i>

                            <i class="ti ti-tag font1"></i>

                            <div class="window-more">
                                <i class="ti ti-dots-circle-horizontal font1"></i>
                                <i class="ti ti-chevron-down"></i>
                            </div>
                        </div>

                        <div class="quick-more">
                            <i class="ti ti-chevron-down"></i>

                            <i class="ti ti-search font1"></i>
                        </div>

                    </div>
                </div>

                <div class="window-content"></div>

            </div>
        </div>

    </main>
    <footer class="dock">
        <div class="dock-container">
            <button class="dock-item">
                <img src="./Assets/Icons/finder.png" alt="finder">
            </button>
            <button class="dock-item">
                <img src="./Assets/Icons/brave.png" alt="brave">
            </button>
            <button class="dock-item">
                <img src="./Assets/Icons/mail.png" alt="mail">
            </button>
            <button class="dock-item">
                <img src="./Assets/Icons/chatgpt.png" alt="chatgpt">
            </button>
            <button class="dock-item">
                <img src="./Assets/Icons/appstore.png" alt="appstore">
            </button>
            <button class="dock-item">
                <img src="./Assets/Icons/settings.png" alt="settings">
            </button>
            <button class="dock-item">
                <img src="./Assets/Icons/photos.png" alt="photos">
            </button>
            <button class="dock-item">
                <img src="./Assets/Icons/vscode.png" alt="vscode">
            </button>
            <button class="dock-item">
                <img src="./Assets/Icons/bin.png" alt="bin">
            </button>

        </div>
    </footer>
</body>

</html>
